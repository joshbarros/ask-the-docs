[project]
name = "ask-the-docs-api"
version = "0.1.0"
description = "Ask the Docs — production RAG backend (chunking, hybrid retrieval, grounded answers, evals)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "python-dotenv>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
